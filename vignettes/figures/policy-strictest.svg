<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" width="468" height="216" id="dark">
<style>
svg{--ink:#1c1e22;--bg:#fff;--mute:#4a4e55;--s1:#b85450;--s2:#6c8ebf}
:target{--ink:#efede7;--bg:#1c1e22;--mute:#a8a59d;--s2:#7d9dcb}
.bg{fill:var(--bg)}
.ln,.dash{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:3 2.5}
.dot{fill:var(--ink)}
.s1{fill:var(--s1)}
.s2{fill:var(--s2)}
text{fill:var(--ink);font:500 8px "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.t{font:600 8.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.n{fill:var(--mute);font:7.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[pathLength]{stroke-dasharray:1}
.a1,.a2,.a3,.a4,.a5,.a6,.a7{animation:d .7s .2s linear both}
.a2{animation-delay:1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.6s}
.a5{animation-delay:3.4s}.a6{animation-delay:4.2s}.a7{animation-delay:5s}
:is(.a1,.a2,.a3,.a4,.a5,.a6,.a7)[marker-end]{animation-name:d,m}
.x{opacity:0;animation-name:x}
@keyframes d{from{opacity:0;stroke-dashoffset:1}}
@keyframes m{from,99%{marker-end:none}}
@keyframes x{from{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M1.5 1 5 3 1.5 5"/></marker></defs>
<rect class="bg" width="260" height="120"/>
<rect class="s2" x="4" y="30" width="22" height="32"/>
<text class="n" x="15" y="73" text-anchor="middle">model</text>
<text class="n" x="165" y="12" text-anchor="middle">allow</text>
<text class="n" x="192" y="12" text-anchor="middle">modify</text>
<text class="n" x="219" y="12" text-anchor="middle">ask</text>
<text class="n" x="246" y="12" text-anchor="middle">deny</text>
<path class="ln a1" pathLength="1" d="M30 46H76" marker-end="url(#h)"/>
<text class="a1" x="53" y="41" text-anchor="middle">rm(...)</text>
<text class="n a1" x="53" y="56" text-anchor="middle">auto mode</text>
<rect class="dot" x="80" y="20" width="2" height="66"/>
<text x="88" y="33">mode</text>
<path class="ln" d="M161 30H255"/>
<text x="88" y="49">rules</text>
<text x="88" y="65">critical_guard</text>
<path class="ln" d="M161 62H255"/>
<text x="88" y="81">keep_data</text>
<path class="ln" d="M161 78H255"/>
<circle class="dot a2" cx="165" cy="30" r="2.5"/>
<text class="n a3" x="161" y="49">no answer</text>
<circle class="dot a4" cx="219" cy="62" r="2.5"/>
<circle class="dot a5" cx="246" cy="78" r="2.5"/>
<path class="ln a6" pathLength="1" d="M246 20V90"/>
<text class="t a6" x="240" y="94" text-anchor="end">strictest wins</text>
<path class="ln a7" pathLength="1" d="M246 92V104H15V79" marker-end="url(#h)"/>
<text class="n a7" x="130" y="115" text-anchor="middle">an error result; the code does not run</text>
</svg>
