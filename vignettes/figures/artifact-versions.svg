<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 258 120" width="464.4" height="216" id="dark">
<style>
svg{--ink:#1c1e22;--bg:#fff;--mute:#4a4e55;--s1:#b85450;--s2:#6c8ebf}
:target{--ink:#efede7;--bg:#1c1e22;--mute:#a8a59d;--s2:#7d9dcb}
.bg{fill:var(--bg)}
.ln,.dash{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:3 2.5}
.dot{fill:var(--ink)}
.s1{fill:var(--s1)}
.s2{fill:var(--s2)}
text{fill:var(--ink);font:500 8px "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.t{font:600 8.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.n{fill:var(--mute);font:7.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[pathLength]{stroke-dasharray:1}
.a1,.a2,.a3,.a4,.a5,.a6,.a7{animation:d .7s .2s linear both}
.a2{animation-delay:1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.6s}
.a5{animation-delay:3.4s}.a6{animation-delay:4.2s}.a7{animation-delay:5s}
:is(.a1,.a2,.a3,.a4,.a5,.a6,.a7)[marker-end]{animation-name:d,m}
.x{opacity:0;animation-name:x}
@keyframes d{from{opacity:0;stroke-dashoffset:1}}
@keyframes m{from,99%{marker-end:none}}
@keyframes x{from{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M1.5 1 5 3 1.5 5"/></marker></defs>
<rect class="bg" width="260" height="120"/>
<rect class="ln" x="8.5" y="4.5" width="44" height="18" rx="2"/>
<text x="18" y="16.5">app.R</text>
<text class="n" x="58" y="16.5">working copy</text>
<rect class="ln" x="184.5" y="0.5" width="64" height="28" rx="2"/>
<text class="t" x="191" y="12">R session</text>
<text x="191" y="24">survey</text>
<path class="ln a1" pathLength="1" d="M30 24V48" marker-end="url(#h)"/>
<path class="ln a1" pathLength="1" d="M200 31V38H117V47" marker-end="url(#h)"/>
<text class="n a1" x="158" y="35" text-anchor="middle">copy</text>
<g class="a2"><rect class="ln" x="8.5" y="50.5" width="140" height="20" rx="2"/><text class="t" x="14" y="63">v001/</text><text x="50" y="63">app.R</text><text x="86" y="63">data/001.rds</text></g>
<path class="ln a3" pathLength="1" d="M151 60.5H181" marker-end="url(#h)"/>
<text class="n a3" x="166" y="55" text-anchor="middle">launch</text>
<g class="a3"><rect class="ln" x="184.5" y="45.5" width="64" height="30" rx="2"/><text class="t" x="191" y="57">R process</text><text x="191" y="69">127.0.0.1</text></g>
<path class="ln a4" pathLength="1" d="M8 13.5H3V106.5H5" marker-end="url(#h)"/>
<path class="ln a4" pathLength="1" d="M251 14.5H255V101H152" marker-end="url(#h)"/>
<text class="n a4" x="203" y="97" text-anchor="middle">copy</text>
<text class="n a4" x="14" y="86">edit app.R, call peter$app() again</text>
<g class="a5"><rect class="ln" x="8.5" y="96.5" width="140" height="20" rx="2"/><text class="t" x="14" y="109">v002/</text><text x="50" y="109">app.R</text><text x="86" y="109">data/001.rds</text></g>
<text class="n a6" x="156" y="114">each version is kept</text>
</svg>
