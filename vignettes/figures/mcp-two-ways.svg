<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 154" width="390" height="231">
<style>
svg{--ink:#1c1e22;--bg:#fff;--mute:#4a4e55;--s1:#b85450;--s2:#6c8ebf}
@media (prefers-color-scheme:dark){svg:root{--ink:#efede7;--bg:#1c1e22;--mute:#a8a59d;--s2:#7d9dcb}}
.bg{fill:var(--bg)}
.ln,.dash{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:3 2.5}
.dot{fill:var(--ink)}
.s1{fill:var(--s1)}
.s2{fill:var(--s2)}
text{fill:var(--ink);font:500 8px "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.t{font:600 8.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.n{fill:var(--mute);font:7.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[pathLength]{stroke-dasharray:1}
.a1,.a2,.a3,.a4,.a5,.a6,.a7{animation:14s linear infinite both}
.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}.a4{animation-name:a4}
.a5{animation-name:a5}.a6{animation-name:a6}.a7{animation-name:a7}
@keyframes a1{0%,2.9%{opacity:0;stroke-dashoffset:1}9.3%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a2{0%,10.7%{opacity:0;stroke-dashoffset:1}17.1%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a3{0%,18.6%{opacity:0;stroke-dashoffset:1}25%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a4{0%,26.4%{opacity:0;stroke-dashoffset:1}32.9%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a5{0%,34.3%{opacity:0;stroke-dashoffset:1}40.7%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a6{0%,42.1%{opacity:0;stroke-dashoffset:1}48.6%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@keyframes a7{0%,50%{opacity:0;stroke-dashoffset:1}56.4%,94%{opacity:1;stroke-dashoffset:0}98%,to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M1.5 1 5 3 1.5 5"/></marker></defs>
<rect class="bg" width="260" height="154"/>
<text class="t" x="130" y="12" text-anchor="middle">R session</text>
<text class="n" x="130" y="23" text-anchor="middle">your objects</text>
<path class="ln" d="M130 28V148"/>
<rect class="ln" x="198.5" y="32.5" width="58" height="40" rx="3"/>
<text class="t" x="227.5" y="50" text-anchor="middle">server</text>
<text class="n" x="227.5" y="62" text-anchor="middle">stdio or HTTP</text>
<text class="t" x="0" y="44">gptr as client</text>
<text x="0" y="56">peter$mcp$catalog</text>
<path class="ln a1" pathLength="1" d="M132 42H195" marker-end="url(#h)"/>
<text class="a1" x="163" y="37" text-anchor="middle">search()</text>
<text class="n a1" x="163" y="51" text-anchor="middle">JSON args</text>
<path class="ln a2" pathLength="1" d="M196 64H134" marker-end="url(#h)"/>
<text class="n a2" x="163" y="74" text-anchor="middle">an R value</text>
<rect class="s2" x="10" y="88" width="22" height="32"/>
<text class="n" x="21" y="82" text-anchor="middle">MCP client</text>
<text class="t" x="257" y="138" text-anchor="end">gptr as server</text>
<text x="257" y="150" text-anchor="end">gptr_mcp_serve()</text>
<path class="ln a3" pathLength="1" d="M36 98H126" marker-end="url(#h)"/>
<text class="n a3" x="80" y="93" text-anchor="middle">127.0.0.1, bearer token</text>
<text class="a3" x="80" y="107" text-anchor="middle">r(code)</text>
<g class="a4"><rect class="ln" x="126.5" y="104.5" width="7" height="14"/><text x="138" y="115">measurements</text></g>
<path class="ln a5" pathLength="1" d="M126 132H36" marker-end="url(#h)"/>
<text class="n a5" x="80" y="127" text-anchor="middle">text and images</text>
</svg>
