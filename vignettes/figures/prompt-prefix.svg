<text x="127.5" y="51.5" text-anchor="middle">1</text><text x="141.5" y="51.5" text-anchor="middle">2</text><text x="155.5" y="51.5" text-anchor="middle">3</text></g>
<rect class="dot a3" x="60.5" y="57" width="74" height="2"/>
