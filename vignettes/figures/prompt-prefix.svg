<rect class="ln" x="134.5" y="66.5" width="14" height="12"/><rect class="ln" x="148.5" y="66.5" width="14" height="12"/>
<rect class="ln" x="162.5" y="66.5" width="14" height="12"/><rect class="ln" x="176.5" y="66.5" width="14" height="12"/>
<text x="127.5" y="75.5" text-anchor="middle">1</text><text x="141.5" y="75.5" text-anchor="middle">2</text><text x="155.5" y="75.5" text-anchor="middle">3</text>
<text x="169.5" y="75.5" text-anchor="middle">4</text><text x="183.5" y="75.5" text-anchor="middle">5</text>
<rect class="dot" x="60.5" y="81" width="102" height="2"/>
<text class="n" x="198" y="75">repeats 2</text></g>
<g class="a5"><text x="0" y="103">/compact</text>
<rect class="ln" x="60.5" y="94.5" width="60" height="12"/><rect class="ln" x="120.5" y="94.5" width="42" height="12"/>
<rect class="ln" x="162.5" y="94.5" width="14" height="12"/>
<text class="n" x="141.5" y="103" text-anchor="middle">summary</text><text x="169.5" y="103.5" text-anchor="middle">6</text></g>
