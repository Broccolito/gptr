<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 144" width="468" height="259.2" id="dark">
<style>
svg{--ink:#1c1e22;--bg:#fff;--mute:#4a4e55;--s1:#b85450;--s2:#6c8ebf}
:target{--ink:#efede7;--bg:#1c1e22;--mute:#a8a59d;--s2:#7d9dcb}
.bg{fill:var(--bg)}
.ln,.dash{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:3 2.5}
.dot{fill:var(--ink)}
.s1{fill:var(--s1)}
.s2{fill:var(--s2)}
text{fill:var(--ink);font:500 8px "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.t{font:600 8.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.n{fill:var(--mute);font:7.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[pathLength]{stroke-dasharray:1}
.a1,.a2,.a3,.a4,.a5,.a6,.a7{animation:d .7s .2s linear both}
.a2{animation-delay:1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.6s}
.a5{animation-delay:3.4s}.a6{animation-delay:4.2s}.a7{animation-delay:5s}
:is(.a1,.a2,.a3,.a4,.a5,.a6,.a7)[marker-end]{animation-name:d,m}
.x{opacity:0;animation-name:x}
@keyframes d{from{opacity:0;stroke-dashoffset:1}}
@keyframes m{from,99%{marker-end:none}}
@keyframes x{from{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M1.5 1 5 3 1.5 5"/></marker></defs>
<rect class="bg" width="260" height="144"/>
<rect class="ln" x="0.5" y="4.5" width="132" height="56" rx="3"/>
<text class="t" x="8" y="17">analysis.R</text>
<text x="8" y="31">peter("Fit mpg on wt.")</text>
<path class="ln" d="M9 35.5V44.5"/><text x="15" y="42">fit = lm(mpg ~ wt, d)</text>
<text x="8" y="54">plot(fit)</text>
<path class="ln a1" pathLength="1" d="M66 62V82" marker-end="url(#h)"/>
<text class="a1" x="72" y="75">format = "r"</text>
<g class="a2"><text x="0" y="96"># peter("Fit mpg on wt.")</text><text x="0" y="108">fit = lm(mpg ~ wt, d)</text><text x="0" y="120">plot(fit)</text></g>
<path class="ln" d="M1 130.5V139.5"/><text class="n" x="7" y="137">recorded code</text>
<g class="a3"><rect class="dash" x="78.5" y="127.5" width="10" height="15"/><text class="n" x="94" y="137">no model call</text></g>
<path class="ln a4" pathLength="1" d="M134 32H190V82" marker-end="url(#h)"/>
<text class="a4" x="142" y="27">format = "peter"</text>
<g class="a5"><text x="136" y="96">peter("Fit mpg on wt.")</text><text x="136" y="108"># fit = lm(mpg ~ wt, d)</text><text x="136" y="120">plot(fit)</text></g>
<g class="a6"><rect class="s2" x="150" y="127" width="11" height="16"/><text class="n" x="166" y="137">asks the model again</text></g>
</svg>
