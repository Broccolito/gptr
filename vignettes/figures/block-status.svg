<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 156" width="468" height="280.8" id="dark">
<style>
svg{--ink:#1c1e22;--bg:#fff;--mute:#4a4e55;--s1:#b85450;--s2:#6c8ebf}
:target{--ink:#efede7;--bg:#1c1e22;--mute:#a8a59d;--s2:#7d9dcb}
.bg{fill:var(--bg)}
.ln,.dash{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:3 2.5}
.dot{fill:var(--ink)}
.s1{fill:var(--s1)}
.s2{fill:var(--s2)}
text{fill:var(--ink);font:500 8px "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.t{font:600 8.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.n{fill:var(--mute);font:7.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[pathLength]{stroke-dasharray:1}
.a1,.a2,.a3,.a4,.a5,.a6,.a7{animation:d .7s .2s linear both}
.a2{animation-delay:1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.6s}
.a5{animation-delay:3.4s}.a6{animation-delay:4.2s}.a7{animation-delay:5s}
:is(.a1,.a2,.a3,.a4,.a5,.a6,.a7)[marker-end]{animation-name:d,m}
.x{opacity:0;animation-name:x}
@keyframes d{from{opacity:0;stroke-dashoffset:1}}
@keyframes m{from,99%{marker-end:none}}
@keyframes x{from{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="h" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M1.5 1 5 3 1.5 5"/></marker></defs>
<rect class="bg" width="260" height="156"/>
<text x="0" y="10">gptr_source("analysis.R", replay = "auto")</text>
<rect class="ln" x="0.5" y="18.5" width="150" height="115" rx="3"/>
<text class="t" x="8" y="31">analysis.R</text>
<text class="n" x="158" y="31">status</text>
<text class="n" x="237.5" y="31" text-anchor="middle">model</text>
<text x="8" y="48">peter("Fit mpg on wt.")</text>
<path class="ln" d="M9 53.5V62.5"/><text x="15" y="60">fit = lm(mpg ~ wt, d)</text>
<text x="8" y="80">peter("Plot fit by cyl.")</text>
<path class="ln" d="M9 85.5V94.5"/>
<text class="a4 x" x="15" y="92">plot(resid(fit))</text>
<text x="8" y="112">peter("Check residuals.")</text>
<path class="ln" d="M9 117.5V126.5"/><text x="15" y="124">quantile(resid(fit))</text>
<g class="a1"><text x="158" y="48">fresh</text><text class="n" x="158" y="60">runs as recorded</text><rect class="dash" x="232.5" y="44.5" width="10" height="15"/></g>
<path class="ln a2" pathLength="1" d="M84.8 83H113.6"/>
<g class="a2"><text x="158" y="80">stale</text><text class="n" x="158" y="92">prompt changed</text></g>
<rect class="s2 a3" x="232" y="76" width="11" height="16"/>
<text class="a4" x="15" y="92">plot(resid(fit) ~ d$cyl)</text>
<path class="ln a5" pathLength="1" d="M15 127H53.4"/>
<g class="a5"><text x="158" y="112">user-edited</text><text class="n" x="158" y="124">your edit runs</text><rect class="dash" x="232.5" y="108.5" width="10" height="15"/></g>
<path class="ln" d="M1 142.5V151.5"/><text class="n" x="7" y="149">recorded code</text>
<rect class="dash" x="78.5" y="139.5" width="10" height="15"/><text class="n" x="94" y="149">no model call</text>
<rect class="s2" x="150" y="139" width="11" height="16"/><text class="n" x="166" y="149">asks the model again</text>
</svg>
