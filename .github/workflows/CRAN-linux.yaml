name: Linux CRAN mode

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'false'
      R_KEEP_PKG_SOURCE: 'true'
      _R_CHECK_THINGS_IN_OTHER_DIRS_: 'true'
      _R_CHECK_CRAN_INCOMING_: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
      - name: Test the Linux check driver
        run: Rscript --vanilla -e 'testthat::test_file("dev/ci/test-linux-check.R", stop_on_failure = TRUE)'
      - name: Prepare exact Linux suite-root evidence
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - name: R CMD check in CRAN mode (two CPUs)
        run: Rscript --vanilla dev/ci/check-linux.R --compact-vignettes=gs+qpdf
      - name: Observe exact Linux suite roots and check-child exit
        if: always()
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log
      - name: Retain check logs and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-cran-mode
          path: |
            check/gptr.Rcheck/00check.log
            check/gptr.Rcheck/tests/*.Rout*
            check/gptr.Rcheck/tests/testthat/_snaps
            ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
