# gptr's MCP bridge in mcp-bridge/ (D-372, D-374, D-397): unit tests on three systems, live tests
# against this checkout's gptr and CRAN's, the Claude Code and Codex plugins, and on a published
# gptr release the bundle that Biorouter's updater installs from releases/latest with no prompt.
# No job is a required check. Every job has a 20-minute limit and its test and build steps have
# shorter ones.
on:
  push:
    branches: [main]
    paths: &paths
      - 'mcp-bridge/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'DESCRIPTION'
      - 'R/mcp-server.R'
      - '.github/workflows/mcp-bridge.yaml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  release:
    types: [published]

name: mcp-bridge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    name: mcp-bridge unit (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --python 3.13
      - name: Unit tests
        timeout-minutes: 10
        run: uv run python -m unittest discover -s tests -v
      - name: Build the bundle
        timeout-minutes: 5
        run: uv run python scripts/build_brxt.py
      # the Ubuntu bundle is the one testers install before a release carries it
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gptragent-bundle-${{ matrix.os }}
          path: mcp-bridge/dist/
          if-no-files-found: error

  live:
    runs-on: ${{ matrix.os }}
    name: mcp-bridge live (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: mcp-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/system-libraries
        if: runner.os == 'Linux'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # gptr's Imports and the packages gptr_mcp_serve() needs
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          dependencies: '"hard"'
          extra-packages: any::httpuv any::later any::openssl
      - name: Install this checkout's gptr
        timeout-minutes: 5
        working-directory: .
        run: R CMD INSTALL --no-docs --no-multiarch .
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
      - run: uv sync --locked --python 3.13
      - name: gptr's own advertising, and r/attach.R delegating to it
        timeout-minutes: 10
        env:
          GPTRAGENT_LIVE: "1"
        run: uv run python -m unittest tests.test_live -v

  live-cran:
    runs-on: ubuntu-latest
    name: mcp-bridge live (ubuntu-latest, CRAN gptr)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          packages: any::gptr any::httpuv any::later any::openssl
          dependencies: '"hard"'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
      - run: uv sync --locked --python 3.13
      - name: The bundled r/attach.R (the gptr 1.0 and 1.1 path; delegates to gptr 1.2.0 and later)
        timeout-minutes: 10
        env:
          GPTRAGENT_LIVE: "1"
          GPTRAGENT_LIVE_ATTACH: "1"
        run: uv run python -m unittest tests.test_live tests.test_attach -v

  # Neither CLI needs an account for these commands
  plugins:
    runs-on: ubuntu-latest
    name: mcp-bridge plugins
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate the Claude Code marketplace and plugin
        timeout-minutes: 5
        run: |
          npx -y @anthropic-ai/claude-code@2.1.323 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.323 plugin validate mcp-bridge
      - name: Install the Codex plugin from this checkout's marketplace
        timeout-minutes: 5
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          mkdir "$CODEX_HOME"
          npx -y @openai/codex@0.157.1 plugin marketplace add "$GITHUB_WORKSPACE"
          npx -y @openai/codex@0.157.1 plugin add gptr@gptr
          npx -y @openai/codex@0.157.1 mcp get gptr

  # A published gptr release deploys the bundle: Biorouter installs releases/latest's first .brxt
  # at its next launch. gptr's own release step decides which release is latest.
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    name: mcp-bridge release
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mcp-bridge
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
      - name: Refuse a prerelease, a draft, or a tag other than v plus both versions
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRAFT: ${{ github.event.release.draft }}
        run: |
          if [ "$PRERELEASE" != false ] || [ "$DRAFT" != false ]; then
            echo "$RELEASE_TAG is a prerelease or a draft; only a full gptr release carries the bundle." >&2
            exit 1
          fi
          r_version=$(sed -n 's/^Version: *//p' ../DESCRIPTION)
          bundle_version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$RELEASE_TAG" != "v$r_version" ] || [ "$RELEASE_TAG" != "v$bundle_version" ]; then
            echo "Tag $RELEASE_TAG must equal v$r_version (DESCRIPTION) and v$bundle_version (manifest.json)." >&2
            exit 1
          fi
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --python 3.13
      - name: Unit tests
        timeout-minutes: 10
        run: uv run python -m unittest discover -s tests -v
      - name: Build, keeping every bundled skill path of the previous gptr release that has a bundle
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name != env.RELEASE_TAG
            and (.draft or .prerelease | not) and any(.assets[]; .name == "gptragent.brxt"))][0].tag_name // empty')
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern gptragent.brxt --dir previous
            uv run python scripts/build_brxt.py --previous previous/gptragent.brxt
          else
            echo "No earlier gptr release carries gptragent.brxt: building without --previous."
            uv run python scripts/build_brxt.py
          fi
      - name: Attach the bundle to this release, leaving latest unchanged
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/gptragent.brxt "dist/gptragent-${RELEASE_TAG#v}.brxt" dist/SHA256SUMS --clobber
