name: Rscript native workers, artifacts and Python
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform scope for the exact source acceptance run
        type: choice
        default: all
        options: [all, linux, macos, windows]
      source_sha:
        description: Exact reviewed source commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    env:
      GPTR_EXPECTED_SOURCE: ${{ inputs.source_sha }}
      GPTR_LIVE_TESTS: 'false'
      NOT_CRAN: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Validate source
        shell: bash
        run: '[[ "$GPTR_EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: 'test "$(git rev-parse HEAD)" = "$GPTR_EXPECTED_SOURCE"'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: release
          Ncpus: 1
          use-public-rspm: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12.10'
      - name: Provision private pinned numerical Python and admit its native library
        shell: bash
        env:
          GPTR_BASE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$GPTR_BASE_PYTHON" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info[:3] == (3, 12, 10)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-rscript-python'
          assert not root.exists(), 'Private Python directory must be fresh'
          root.mkdir(mode=0o700)
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True, timeout=120)
          executable = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          assert executable.is_file()
          subprocess.run([str(executable), '-m', 'pip', 'install', '--only-binary=:all:',
                          'numpy==2.3.4', 'pandas==2.3.3'], check=True, timeout=180)
          query = """
          import hashlib, json, os, pathlib, sys, sysconfig
          base = pathlib.Path(sys.base_prefix).resolve(strict=True)
          prefix = pathlib.Path(sys.prefix).resolve(strict=True)
          assert base != prefix and sys.version_info[:3] == (3, 12, 10)
          version = f'{sys.version_info.major}.{sys.version_info.minor}'
          if os.name == 'nt':
              candidates = [base / f'python{version.replace(".", "")}.dll']
          else:
              name = sysconfig.get_config_var('LDLIBRARY')
              directory = sysconfig.get_config_var('LIBDIR')
              assert isinstance(name, str) and name and isinstance(directory, str) and directory
              extension = '.dylib' if sys.platform == 'darwin' else '.so'
              candidates = [pathlib.Path(directory) / name, base / pathlib.Path(name).name,
                            base / 'lib' / f'libpython{version}{extension}']
          libraries = {path.resolve(strict=True) for path in candidates if path.is_file()}
          assert len(libraries) == 1, 'Exactly one canonical native library must be admitted'
          library = libraries.pop()
          assert os.path.normcase(os.path.commonpath([str(library), str(base)])) == \
              os.path.normcase(str(base)) and library != base
          size = library.stat().st_size
          assert 0 < size <= 64 * 1024 * 1024
          digest = hashlib.sha256()
          count = 0
          with library.open('rb') as stream:
              while True:
                  chunk = stream.read(1024 * 1024)
                  if not chunk:
                      break
                  count += len(chunk)
                  assert count <= 64 * 1024 * 1024
                  digest.update(chunk)
          assert count == size == library.stat().st_size
          result = json.dumps(dict(python=os.path.abspath(sys.executable), prefix=str(prefix),
              base_prefix=str(base), library=str(library), sha256=digest.hexdigest(),
              library_bytes=count, version='.'.join(map(str, sys.version_info[:3]))))
          assert len(result.encode('utf-8')) <= 4096
          print(result)
          """
          process = subprocess.run([str(executable), '-I', '-c', query], check=True, timeout=10,
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          assert not process.stderr and len(process.stdout) <= 4096
          witness = json.loads(process.stdout)
          assert list(witness) == ['python', 'prefix', 'base_prefix', 'library', 'sha256',
                                   'library_bytes', 'version']
          assert witness['version'] == '3.12.10'
          settings = dict(RETICULATE_PYTHON=str(executable), RETICULATE_USE_MANAGED_VENV='false',
              GPTR_PY_NATIVE_PREFIX=str(root), GPTR_PY_NATIVE_VERSION='3.12.10',
              GPTR_NP_NATIVE_VERSION='2.3.4', GPTR_PD_NATIVE_VERSION='2.3.3',
              GPTR_PY_NATIVE_LIBPYTHON=witness['library'], GPTR_PY_NATIVE_LIB_SHA256=witness['sha256'])
          assert all('\n' not in value and '\r' not in value for value in settings.values())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in settings.items():
                  output.write(key + '=' + value + '\n')
          evidence = pathlib.Path('rscript-evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'python-admission.json').write_text(json.dumps(witness, indent=2),
                                                         encoding='utf-8')
          PY
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          dependencies: 'c("Imports", "LinkingTo")'
          extra-packages: any::pkgload any::testthat any::withr any::shiny any::httpuv any::later any::chromote any::openssl any::lintr any::reticulate any::knitr
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: '155.0.8059.39'
          install-dependencies: true
      - name: Install exact GPTR source for workers
        shell: bash
        run: R CMD INSTALL --no-docs --no-multiarch .
      - name: Test source and installed execution serially
        shell: bash
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p rscript-evidence
          Rscript --vanilla dev/ci/rscript-native.R source rscript-evidence/source 2>&1 | tee rscript-evidence/source.log
          Rscript --vanilla dev/ci/rscript-native.R installed rscript-evidence/installed 2>&1 | tee rscript-evidence/installed.log
      - name: Lint the reviewed runtime and fixtures
        shell: bash
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
        run: Rscript --vanilla dev/ci/lint-rscript.R
      - name: Retain exact native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rscript-${{ matrix.os }}-${{ inputs.source_sha }}
          path: rscript-evidence
          if-no-files-found: error
          retention-days: 14
