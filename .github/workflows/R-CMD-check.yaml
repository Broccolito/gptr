# CRAN's check matrix plus the contract's jobs (IC-59, IC-72, IC-73); the Windows rows run in
# Windows-check.yaml. rcmdcheck reports success when R CMD check aborts early, so every check job
# also requires the log's Status line.
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check.yaml

# Running checks finish (frequent pushes would otherwise cancel every run); the newest push waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    timeout-minutes: ${{ matrix.config.minutes || 45 }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          # R-devel installs every dependency from source (about 65 minutes on a cold cache)
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release', minutes: 120}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'oldrel-4'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_THINGS_IN_OTHER_DIRS_: true
      _R_CHECK_CRAN_INCOMING_: false
      # Linux rows run test files in two testthat workers; every other check stays serial
      TESTTHAT_PARALLEL: ${{ startsWith(matrix.config.os, 'ubuntu') }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
        if: runner.os == 'Linux'
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Isolate checker temporary files on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          gptr_check_tmp=$(mktemp -d "$RUNNER_TEMP/gptr-check-tmp.XXXXXX")
          chmod 700 "$gptr_check_tmp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$gptr_check_tmp" "$gptr_check_tmp" "$gptr_check_tmp" >> "$GITHUB_ENV"
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-${{ matrix.config.r }}
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: grep '^Status:' check/gptr.Rcheck/00check.log

  no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests)
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck any::testthat any::knitr any::rmarkdown
          needs: check
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-noSuggests
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log

  c-locale:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, LC_ALL=C)
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: C
      LANG: C
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-locale-C
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log

  cran-mode:
    runs-on: ubuntu-latest
    name: ubuntu-latest (devel, NOT_CRAN=false)
    # R-devel installs every dependency from source (about 65 minutes on a cold cache)
    timeout-minutes: 120
    # CRAN's timing thresholds; a NOTE fails, and so does a check over 480 s, under the 600 s at
    # which CRAN's pretest flags a package (CI-93)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: false
      _R_CHECK_THINGS_IN_OTHER_DIRS_: true
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
      _R_CHECK_EXAMPLE_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
      _R_CHECK_EXAMPLE_TIMING_THRESHOLD_: 5
      _R_CHECK_LIMIT_CORES_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Prepare exact Linux suite-root evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gptr_root_evidence="$RUNNER_TEMP/gptr-test-root-evidence"
          mkdir -m 700 "$gptr_root_evidence"
          printf 'GPTR_TEST_ROOT_EVIDENCE=%s\nGPTR_TEST_ROOT_READER=%s\nGPTR_TEST_ROOT_PYTHON=%s\n' \
            "$gptr_root_evidence" "$GITHUB_WORKSPACE/dev/ci/test-root-teardown-readback.py" \
            /usr/bin/python3 >> "$GITHUB_ENV"
      - name: Start the check's clock
        run: echo "GPTR_CHECK_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
      - name: Fail if the check took over 480 s
        if: always()
        run: |
          secs=$(( $(date +%s) - GPTR_CHECK_START ))
          echo "R CMD check took $secs s (budget 480 s)"
          test "$secs" -le 480
      - name: Observe exact Linux suite roots and check-child exit
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -I -B dev/ci/test-root-teardown-readback.py \
            child-exit "$RUNNER_TEMP/gptr-test-root-evidence"
      - name: Retain Linux suite-root teardown evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-suite-root-cran-mode
          path: ${{ runner.temp }}/gptr-test-root-evidence
          if-no-files-found: error
          retention-days: 5
      - name: Fail unless R CMD check wrote its status
        run: grep '^Status:' check/gptr.Rcheck/00check.log

  copy-safety:
    runs-on: ubuntu-latest
    name: copy-safety (${{ matrix.r }})
    timeout-minutes: ${{ matrix.r == 'devel' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'devel']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::devtools
      - name: Copy-safety suites
        run: |
          Rscript --vanilla -e 'stopifnot(capabilities("profmem"))'
          Rscript --vanilla -e 'devtools::test(filter = "copy", stop_on_failure = TRUE)'

  connections:
    runs-on: ubuntu-latest
    name: connections left open
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::devtools
      - name: Prove the connection gate detects a leak
        run: Rscript --vanilla -e 'testthat::test_file("dev/ci/test-check-connections.R", stop_on_failure = TRUE)'
      - name: Test suite with explicit connection cleanup check (all tests run, then both gates)
        run: Rscript --vanilla dev/ci/check-connections.R

  bench:
    runs-on: ubuntu-latest
    name: token benchmark
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: ./.github/actions/system-libraries
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: 'false'
        with:
          extra-packages: any::rtiktoken any::pkgload
      - name: Token ratchet
        run: Rscript --vanilla dev/bench/tokens/run.R --check
      - name: Polyglot token ratchet (B and C within 10%, P24)
        run: Rscript --vanilla dev/bench/polyglot/run.R --check
      - name: Offline INFRA suite under 60 s (INFRA-24, P24)
        run: Rscript --vanilla dev/bench/perf/infra-time.R
      - name: Development tests of dev/bench (P24)
        run: Rscript --vanilla -e 'testthat::test_dir("dev/bench/tests", stop_on_failure = TRUE)'
