# gptr CI (P01; report 13 section 3.8, contract IC-59, IC-72, IC-73). The matrix mirrors CRAN:
# macOS, Windows and Ubuntu release, devel and oldrel-1, oldrel-4 (proves R >= 4.2.0), a job
# without Suggests, an LC_ALL=C job, the copy-safety suites, a connections-left-open run and the
# token benchmark once dev/bench/tokens/run.R exists (P07).
# Every job has a time limit, and each R CMD check job fails unless the check wrote its final
# status line: rcmdcheck reports success when R CMD check aborts before checking anything.
# The Windows release job first streams the offline tests file by file (diagnosis only).
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # R-devel installs every dependency from source (about 65 minutes on a cold cache)
    timeout-minutes: ${{ matrix.config.r == 'devel' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows R before 4.5.0: file.info() has no owner columns, which
          # _R_CHECK_THINGS_IN_OTHER_DIRS_ needs (R CMD check aborts at its start otherwise)
          - {os: windows-latest, r: 'oldrel-4', things-in-other-dirs: 'false'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'oldrel-4'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_THINGS_IN_OTHER_DIRS_: ${{ matrix.config.things-in-other-dirs || 'true' }}
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # R CMD check prints the test output only after the tests end, so a hung Windows run named
      # no file (CI Task CI-2). This streams the offline suite file by file and test by test
      # first, within its own limit; it only diagnoses, and the R CMD check below is the gate.
      - name: Offline tests file by file (Windows release diagnosis)
        if: runner.os == 'Windows' && matrix.config.r == 'release'
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        env:
          NOT_CRAN: 'true'
        run: Rscript --vanilla dev/ci/test-by-file.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: |
          log=check/gptr.Rcheck/00check.log
          if [ ! -f "$log" ]; then
            echo "::error::R CMD check did not write $log"
            exit 1
          fi
          if ! grep -q '^Status:' "$log"; then
            echo "::error::$log has no Status line: R CMD check did not finish"
            exit 1
          fi
          grep '^Status:' "$log"

  no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests)
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck any::testthat any::knitr any::rmarkdown
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: |
          log=check/gptr.Rcheck/00check.log
          if [ ! -f "$log" ]; then
            echo "::error::R CMD check did not write $log"
            exit 1
          fi
          if ! grep -q '^Status:' "$log"; then
            echo "::error::$log has no Status line: R CMD check did not finish"
            exit 1
          fi
          grep '^Status:' "$log"

  c-locale:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, LC_ALL=C)
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: C
      LANG: C
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: |
          log=check/gptr.Rcheck/00check.log
          if [ ! -f "$log" ]; then
            echo "::error::R CMD check did not write $log"
            exit 1
          fi
          if ! grep -q '^Status:' "$log"; then
            echo "::error::$log has no Status line: R CMD check did not finish"
            exit 1
          fi
          grep '^Status:' "$log"

  copy-safety:
    runs-on: ubuntu-latest
    name: copy-safety (${{ matrix.r }})
    timeout-minutes: ${{ matrix.r == 'devel' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'devel']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Copy-safety suites
        shell: bash
        run: |
          Rscript --vanilla -e 'stopifnot(capabilities("profmem"))'
          if ls tests/testthat/test-copy-*.R > /dev/null 2>&1; then
            Rscript --vanilla -e 'devtools::test(filter = "copy", stop_on_failure = TRUE)'
          else
            echo "No test-copy-*.R suites yet (they arrive with P08 and later plans)."
          fi

  connections:
    runs-on: ubuntu-latest
    name: connections left open
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CONNECTIONS_LEFT_OPEN_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Prove the connection gate detects a leak
        run: Rscript --vanilla -e 'testthat::test_file("dev/ci/test-check-connections.R", stop_on_failure = TRUE)'
      - name: Test suite with explicit connection cleanup check (all tests run, then both gates)
        run: Rscript --vanilla dev/ci/check-connections.R

  bench:
    runs-on: ubuntu-latest
    name: token benchmark
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rtiktoken any::pkgload
      - name: Token ratchet (dev/bench/tokens/run.R, from P07)
        shell: bash
        run: |
          if [ -f dev/bench/tokens/run.R ]; then
            Rscript --vanilla dev/bench/tokens/run.R --check
          else
            echo "dev/bench/tokens/run.R does not exist yet (P07 adds it)."
          fi
