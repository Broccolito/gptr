# On-demand diagnosis (D-019, CI-19): the offline suite file by file on Windows release with the
# package installed (worker tests run, as under R CMD check), naming each file's time and the file
# a slow or hung check is in. Run: gh workflow run windows-by-file.yaml
name: windows-by-file

on: workflow_dispatch

permissions: read-all

jobs:
  by-file:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
      - name: Install the package
        shell: bash
        run: R CMD INSTALL .
      - name: Offline tests file by file
        shell: bash
        run: Rscript --vanilla dev/ci/test-by-file.R
