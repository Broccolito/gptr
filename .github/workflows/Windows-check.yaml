# R-CMD-check.yaml's Windows rows (release, oldrel-4), each split into four serial R CMD check
# shards. The required contexts windows-latest (release) and windows-latest (oldrel-4) are gates
# that pass only when all four shards of their R version passed.
on:
  push:
    branches: [main]
  pull_request:

name: Windows-check.yaml

# Running checks finish (frequent pushes would otherwise cancel every run); the newest push waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  shards:
    runs-on: windows-latest
    name: windows-latest (${{ matrix.r }}, shard ${{ matrix.shard }}/4)
    # The slowest shard took about 23 minutes in October 2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'oldrel-4']
        shard: [1, 2, 3, 4]
        include:
          # Windows R < 4.5.0: file.info() lacks the owner columns this check variable needs
          - {r: 'oldrel-4', things-in-other-dirs: 'false'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_THINGS_IN_OTHER_DIRS_: ${{ matrix.things-in-other-dirs || 'true' }}
      _R_CHECK_CRAN_INCOMING_: false
      TESTTHAT_PARALLEL: false
      GPTR_CI_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          # Nothing compiles, so setup-r installs no Rtools
          rtools-version: none
      # Without its Rtools, R 4.2 finds no qpdf for the PDF checks; all shards use the image's qpdf
      - name: Point R at the image's preinstalled qpdf
        shell: bash
        run: |
          qpdf=$(ls -d /c/rtools*/usr/bin/qpdf.exe | tail -n 1)
          "$qpdf" --version
          echo "R_QPDF=$(cygpath -w "$qpdf")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: windows_python
        with:
          python-version: '3.12.10'
      - name: Provision the Windows private numerical Python and admit its native library
        shell: bash
        env:
          GPTR_BASE_PYTHON: ${{ steps.windows_python.outputs.python-path }}
        run: |
          "$GPTR_BASE_PYTHON" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info[:3] == (3, 12, 10)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-rscript-python'
          assert not root.exists(), 'Private Python directory must be fresh'
          root.mkdir(mode=0o700)
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True, timeout=120)
          executable = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          assert executable.is_file()
          subprocess.run([str(executable), '-m', 'pip', 'install', '--only-binary=:all:',
                          'numpy==2.3.4', 'pandas==2.3.3'], check=True, timeout=180)
          query = """
          import hashlib, json, os, pathlib, sys, sysconfig
          base = pathlib.Path(sys.base_prefix).resolve(strict=True)
          prefix = pathlib.Path(sys.prefix).resolve(strict=True)
          assert base != prefix and sys.version_info[:3] == (3, 12, 10)
          version = f'{sys.version_info.major}.{sys.version_info.minor}'
          if os.name == 'nt':
              candidates = [base / f'python{version.replace(".", "")}.dll']
          else:
              name = sysconfig.get_config_var('LDLIBRARY')
              directory = sysconfig.get_config_var('LIBDIR')
              assert isinstance(name, str) and name and isinstance(directory, str) and directory
              extension = '.dylib' if sys.platform == 'darwin' else '.so'
              candidates = [pathlib.Path(directory) / name, base / pathlib.Path(name).name,
                            base / 'lib' / f'libpython{version}{extension}']
          libraries = {path.resolve(strict=True) for path in candidates if path.is_file()}
          assert len(libraries) == 1, 'Exactly one canonical native library must be admitted'
          library = libraries.pop()
          assert os.path.normcase(os.path.commonpath([str(library), str(base)])) == \
              os.path.normcase(str(base)) and library != base
          size = library.stat().st_size
          assert 0 < size <= 64 * 1024 * 1024
          digest = hashlib.sha256()
          count = 0
          with library.open('rb') as stream:
              while True:
                  chunk = stream.read(1024 * 1024)
                  if not chunk:
                      break
                  count += len(chunk)
                  assert count <= 64 * 1024 * 1024
                  digest.update(chunk)
          assert count == size == library.stat().st_size
          result = json.dumps(dict(python=os.path.abspath(sys.executable), prefix=str(prefix),
              base_prefix=str(base), library=str(library), sha256=digest.hexdigest(),
              library_bytes=count, version='.'.join(map(str, sys.version_info[:3]))))
          assert len(result.encode('utf-8')) <= 4096
          print(result)
          """
          process = subprocess.run([str(executable), '-I', '-c', query], check=True, timeout=10,
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          assert not process.stderr and len(process.stdout) <= 4096
          witness = json.loads(process.stdout)
          assert list(witness) == ['python', 'prefix', 'base_prefix', 'library', 'sha256',
                                   'library_bytes', 'version']
          assert witness['version'] == '3.12.10'
          settings = dict(RETICULATE_PYTHON=str(executable), RETICULATE_USE_MANAGED_VENV='false',
              GPTR_PY_NATIVE_PREFIX=str(root), GPTR_PY_NATIVE_VERSION='3.12.10',
              GPTR_NP_NATIVE_VERSION='2.3.4', GPTR_PD_NATIVE_VERSION='2.3.3',
              GPTR_PY_NATIVE_LIBPYTHON=witness['library'], GPTR_PY_NATIVE_LIB_SHA256=witness['sha256'])
          assert all('\n' not in value and '\r' not in value for value in settings.values())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in settings.items():
                  output.write(key + '=' + value + '\n')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-check-python-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'python-admission.json').write_text(json.dumps(witness, indent=2),
                                                         encoding='utf-8')
          PY
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          artifact-name: windows-results-${{ matrix.r }}-${{ matrix.shard }}
          snapshot-artifact-name: windows-snapshots-${{ matrix.r }}-${{ matrix.shard }}
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Fail unless R CMD check wrote its status
        shell: bash
        run: grep '^Status:' check/gptr.Rcheck/00check.log
      - name: Retain this shard's Python admission, check log and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-check-${{ matrix.r }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/gptr-check-python-evidence/python-admission.json
            check/gptr.Rcheck/00check.log
            check/gptr.Rcheck/tests/native-*.Rout*
            check/gptr.Rcheck/tests/testthat.Rout*
          if-no-files-found: error
          retention-days: 5
      - name: Mark this shard as passed
        shell: bash
        run: echo ok > windows-ok-${{ matrix.r }}-${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ok-${{ matrix.r }}-${{ matrix.shard }}
          path: windows-ok-${{ matrix.r }}-${{ matrix.shard }}
          retention-days: 5

  gates:
    runs-on: ubuntu-latest
    name: windows-latest (${{ matrix.r }})
    needs: shards
    # A skipped required check counts as passing, so each gate always runs and fails closed
    if: always()
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'oldrel-4']
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: windows-ok-${{ matrix.r }}-*
          merge-multiple: true
      - name: Fail unless all four shards of this R version passed
        run: |
          missing=""
          for n in 1 2 3 4; do
            [ -f "windows-ok-${{ matrix.r }}-$n" ] || missing="$missing $n/4"
          done
          if [ -n "$missing" ]; then
            echo "::error::These windows-latest (${{ matrix.r }}) shards did not pass:$missing"
            exit 1
          fi
