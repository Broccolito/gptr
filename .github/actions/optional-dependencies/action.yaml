name: Optional integration dependencies
description: Configure explicit tools for the dedicated offline integration lane
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      id: python
      with:
        python-version: '3.12.12'
    - name: Install fixed Python numerical dependencies
      shell: bash
      run: |
        python -m pip install --only-binary=:all: pandas==2.3.3 numpy==2.3.4
    - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      with:
        version: '1.10.19'
    - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      id: chrome
      with:
        chrome-version: '155.0.8059.39'
        install-dependencies: true
    - name: Install checksum-verified official ripgrep
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, io, json, os, pathlib, tarfile, urllib.request, zipfile
        assert os.environ['RUNNER_ARCH'] == 'X64', 'Review the architecture-specific ripgrep pin'
        windows = os.environ['RUNNER_OS'] == 'Windows'
        assert windows or os.environ['RUNNER_OS'] == 'Linux'
        asset, expected = (
            ('ripgrep-15.1.0-x86_64-pc-windows-msvc.zip',
             '124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a') if windows else
            ('ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz',
             '1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599'))
        url = 'https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/' + asset
        with urllib.request.urlopen(url, timeout=60) as response:
            raw = response.read()
        assert hashlib.sha256(raw).hexdigest() == expected, 'Official ripgrep archive digest mismatch'
        binary = 'rg.exe' if windows else 'rg'
        if windows:
            with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                names = [name for name in archive.namelist() if name.endswith('/' + binary)]
                assert len(names) == 1
                contents = archive.read(names[0])
        else:
            with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
                members = [member for member in archive.getmembers()
                           if member.isfile() and member.name.endswith('/' + binary)]
                assert len(members) == 1
                contents = archive.extractfile(members[0]).read()
        folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptr-optional-rg'
        folder.mkdir()
        executable = folder / binary
        executable.write_bytes(contents)
        executable.chmod(0o700)
        with open(os.environ['GITHUB_PATH'], 'a') as output:
            output.write(str(folder) + '\n')
        evidence = pathlib.Path('optional-evidence')
        evidence.mkdir(exist_ok=True)
        (evidence / 'ripgrep-pin.json').write_text(json.dumps(
            {'asset': asset, 'archive_sha256': expected,
             'binary_sha256': hashlib.sha256(contents).hexdigest()}, indent=2))
        PY
    - name: Discover and export only explicit tool settings
      shell: bash
      env:
        GPTR_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        GPTR_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        python dev/ci/optional-dependencies.py --python "$GPTR_TEST_PYTHON" \
          --chrome "$GPTR_TEST_CHROME" --github-env "$GITHUB_ENV" \
          --manifest optional-evidence/dependency-discovery.json
