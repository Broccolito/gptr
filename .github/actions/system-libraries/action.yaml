name: Ubuntu system libraries
description: >-
  Install, before setup-r, the Ubuntu packages setup-r installs and the libraries of gptr's R
  dependencies; setup-r-dependencies then runs with PKG_SYSREQS 'false': pak would also install
  chromium from a Launchpad PPA, and chromote uses the runner's Google Chrome
runs:
  using: composite
  steps:
    # The packages apt downloads, cached per runner image and package list: a slow Ubuntu mirror
    # (70 MB in 7 minutes on 2026-11-03) then costs only the first job of an image
    - id: image
      shell: bash
      run: |
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo "list=$(sha256sum "$GITHUB_ACTION_PATH/action.yaml" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    # a new runner image or package list starts from the newest archives of the same Ubuntu
    # release, so apt downloads only what changed (each job downloaded all 78 MB on 2026-11-19)
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        key: apt-${{ steps.image.outputs.image }}-${{ steps.image.outputs.list }}
        restore-keys: apt-${{ steps.image.outputs.os }}-
    - name: Install the R dependencies' system libraries
      shell: bash
      run: |
        set -euo pipefail
        archives="$RUNNER_TEMP/apt-archives"
        mkdir -p "$archives/partial"
        # a mirror connection that stalls is dropped after 20 s and retried, not waited on until
        # the job's time limit (a 26.9 MB pandoc download stalled 8 minutes on 2026-11-19)
        net=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=5)
        sudo apt-get update "${net[@]}"
        packages=(
          # what setup-r installs, then what the R .deb it installs depends on: an AWS runner's
          # mirror gave setup-r 33 kB/s and 16 minutes for them on 2026-11-19
          gdebi-core qpdf devscripts ghostscript
          libbz2-dev libdeflate-dev libopenblas-dev libtirpc-dev
          libcurl4-openssl-dev libssl-dev xz-utils cmake make libuv1-dev zlib1g-dev
          libsecret-1-dev pandoc libmagick++-dev gsfonts libpng-dev libfreetype-dev
          libjpeg-dev libtiff-dev libwebp-dev libicu-dev libfontconfig1-dev
          libfribidi-dev libharfbuzz-dev python3 libxml2-dev
          libgit2-dev libprotobuf-dev libprotoc-dev protobuf-compiler
        )
        sudo apt-get install -y "${net[@]}" -o Dir::Cache::Archives="$archives" \
          -o APT::Keep-Downloaded-Packages=true "${packages[@]}"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        for package in "${packages[@]}"; do
          [[ "$(dpkg-query -W -f='${Status}' "$package")" == 'install ok installed' ]]
        done
    # saved now, not at the job's end, so a job that a slow mirror still cancels warms its rerun
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.restore.outputs.cache-primary-key }}
