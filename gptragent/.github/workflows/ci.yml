name: Extension checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --python 3.13
      - name: Unit tests (discovery per OS, record checks, liveness, retries, 0, 1 and 2 sessions, images)
        run: uv run python -m unittest discover -s tests -v
      - name: Build the bundle
        run: uv run python scripts/build_brxt.py

  live:
    # S12 of the BAAM end-to-end plan without a model: CRAN gptr in a real interactive R.
    name: live R (${{ matrix.os }}, CRAN gptr)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install gptr and its serving packages from CRAN
        run: Rscript -e 'install.packages(c("gptr", "httpuv", "later", "openssl")); cat("gptr", format(packageVersion("gptr")), "\n")'
      - run: uv sync --locked --python 3.13
      - name: The bundled attach.R (the gptr 1.0 and 1.1 path; delegates to gptr 1.2.0 and later)
        env:
          GPTRAGENT_LIVE: "1"
          GPTRAGENT_LIVE_ATTACH: "1"
        run: uv run python -m unittest tests.test_live tests.test_attach -v
      - name: gptr's own advertising (gptr 1.2.0 and later; attach.R before)
        env:
          GPTRAGENT_LIVE: "1"
        run: uv run python -m unittest tests.test_live -v
